services:
  - type: web
    name: ledger-web-costumer
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium"
    startCommand: "gunicorn --timeout 120 --workers 1 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LEDGER_WEB_URL
        value: https://ledger-web-app.onrender.com
      - key: PORTAL_USER
        sync: false
      - key: PORTAL_PASSWORD
        sync: false
