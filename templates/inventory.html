{% extends "base.html" %}
{% block title %}Live Inventory{% endblock %}

{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
  <h1 class="page-title" style="margin:0;">Live Inventory</h1>
  <div style="display:flex;align-items:center;gap:.7rem;font-size:.82rem;">
    <span id="syncDot" style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;"></span>
    <span id="syncLabel" style="color:var(--muted);">Syncing…</span>
    <button class="btn btn-ghost no-print" style="font-size:.8rem;padding:.4rem .9rem;" onclick="loadInventory()">↺ Refresh</button>
  </div>
</div>

<div class="search-bar no-print" style="flex-wrap:wrap;">
  <span style="color:var(--muted);">🔍</span>
  <input id="searchInput" placeholder="Search products…" oninput="filter()" style="min-width:120px;flex:1;">
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
    <select id="categoryFilter" onchange="filter()" style="width:auto;padding:.4rem .8rem;font-size:.85rem;">
      <option value="">All Categories</option>
    </select>
    <select id="stockFilter" onchange="filter()" style="width:auto;padding:.4rem .8rem;font-size:.85rem;">
      <option value="">All Stock</option>
      <option value="in">In Stock</option>
      <option value="low">Low Stock (≤5)</option>
      <option value="oos">Out of Stock</option>
    </select>
  </div>
</div>

<div class="grid-3 no-print" style="margin-bottom:1.5rem;" id="kpiRow">
  <div class="stat-tile">
    <div class="label">Total Products</div>
    <div class="value" id="kpiTotal">—</div>
  </div>
  <div class="stat-tile">
    <div class="label">Out of Stock</div>
    <div class="value" id="kpiOos" style="color:var(--red)">—</div>
  </div>
  <div class="stat-tile">
    <div class="label">Low Stock</div>
    <div class="value" id="kpiLow" style="color:var(--yellow)">—</div>
  </div>
</div>

<div class="card">
  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem;">Loading live inventory…</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allData = [];
let shownHeaders = [];

async function loadInventory() {
  document.getElementById('syncDot').style.background = 'var(--yellow)';
  document.getElementById('syncLabel').textContent = 'Syncing…';
  try {
    const r = await fetch('/api/inventory');
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    // Pick relevant headers to show
    const priorityCols = ['Product Name','Item Name','Product','HSN','Price/Pc (Rs.)','Price','Remaining Qty','Remaining','Category'];
    shownHeaders = (d.headers || []).filter(h => priorityCols.includes(h) || h === 'Category');
    // Ensure Category shown
    if (!shownHeaders.includes('Category')) shownHeaders.push('Category');

    allData = d.data || [];

    // Build category filter
    const cats = [...new Set(allData.map(r => r.Category || '').filter(Boolean))].sort();
    const sel = document.getElementById('categoryFilter');
    sel.innerHTML = '<option value="">All Categories</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');

    // KPIs
    const remKey = shownHeaders.find(h => h.includes('Remaining'));
    if (remKey) {
      const oos = allData.filter(r => parseFloat(String(r[remKey]||'0').replace(',','')) <= 0).length;
      const low = allData.filter(r => { const v = parseFloat(String(r[remKey]||'0').replace(',','')); return v > 0 && v <= 5; }).length;
      document.getElementById('kpiTotal').textContent = allData.length;
      document.getElementById('kpiOos').textContent = oos;
      document.getElementById('kpiLow').textContent = low;
    }

    document.getElementById('syncDot').style.background = 'var(--green)';
    document.getElementById('syncLabel').textContent = 'Live — updated just now';
    render(allData);
  } catch(e) {
    document.getElementById('syncDot').style.background = 'var(--red)';
    document.getElementById('syncLabel').textContent = 'Error: ' + e.message;
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="6" style="text-align:center;color:var(--red);padding:2rem;">Could not reach main ledger: ${e.message}</td></tr>`;
  }
}

function stockBadge(rem) {
  const v = parseFloat(String(rem||'0').replace(',',''));
  if (v <= 0) return '<span class="badge badge-red">Out of Stock</span>';
  if (v <= 5) return '<span class="badge badge-yellow">Low: ' + v + '</span>';
  return '<span class="badge badge-green">' + v + '</span>';
}

function render(rows) {
  if (!rows.length) {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem;">No products found</td></tr>';
    return;
  }
  const colsToShow = ['Product Name','Item Name','Product','Price/Pc (Rs.)','Price','Remaining Qty','Remaining','Category']
    .filter(h => shownHeaders.includes(h) || h === 'Category');
  const uniqueCols = [...new Set(colsToShow)];

  document.getElementById('tableHead').innerHTML = '<tr>' +
    uniqueCols.map(h => `<th>${h}</th>`).join('') + '</tr>';

  const remKey = uniqueCols.find(h => h.includes('Remaining'));
  document.getElementById('tableBody').innerHTML = rows.map(row => {
    return '<tr>' + uniqueCols.map(h => {
      if (h === remKey) return `<td>${stockBadge(row[h])}</td>`;
      const v = row[h] ?? '—';
      return `<td>${v}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function filter() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const stock = document.getElementById('stockFilter').value;
  const nameKey = shownHeaders.find(h => ['Product Name','Item Name','Product'].includes(h)) || 'Product Name';
  const remKey = shownHeaders.find(h => h.includes('Remaining'));

  const filtered = allData.filter(r => {
    const name = String(r[nameKey] || '').toLowerCase();
    const matchQ = !q || name.includes(q);
    const matchCat = !cat || r.Category === cat;
    let matchStock = true;
    if (stock && remKey) {
      const v = parseFloat(String(r[remKey]||'0').replace(',',''));
      if (stock === 'in') matchStock = v > 5;
      else if (stock === 'low') matchStock = v > 0 && v <= 5;
      else if (stock === 'oos') matchStock = v <= 0;
    }
    return matchQ && matchCat && matchStock;
  });
  render(filtered);
}

loadInventory();
// Auto-refresh every 60 seconds
setInterval(loadInventory, 60000);
</script>
{% endblock %}
