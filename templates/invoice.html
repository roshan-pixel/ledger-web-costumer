{% extends "base.html" %}
{% block title %}New Invoice{% endblock %}

{% block content %}
<style>
#printInvoice{display:none;}
@media print{
  @page{size:A4;margin:14mm;}
  html,body{background:#fff !important;color:#111 !important;}
  body *{visibility:hidden;}
  .sidebar,.topbar,.sidebar-overlay,.no-print,#invCard,.page-title{display:none !important;}
  .main{margin:0 !important;padding:0 !important;}
  #printInvoice,#printInvoice *{visibility:visible;}
  #printInvoice{display:block;position:absolute;left:0;top:0;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#111;}
  #printInvoice .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1f2a44;padding-bottom:10px;}
  #printInvoice .biz{font-size:22px;font-weight:700;color:#1f2a44;}
  #printInvoice .ttl{font-size:26px;font-weight:700;letter-spacing:2px;color:#1f2a44;text-align:right;}
  #printInvoice .meta{display:flex;justify-content:space-between;margin:16px 0;gap:20px;}
  #printInvoice .meta .box{flex:1;border:1px solid #cbd2dc;padding:10px 12px;border-radius:4px;}
  #printInvoice .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#667085;margin-bottom:4px;}
  #printInvoice table{width:100%;border-collapse:collapse;margin-top:6px;}
  #printInvoice th{background:#1f2a44 !important;color:#fff !important;padding:8px;text-align:left;font-size:11px;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #printInvoice td{padding:8px;border-bottom:1px solid #dde1e8;}
  #printInvoice tr{page-break-inside:avoid;}
  #printInvoice .r{text-align:right;}
  #printInvoice .c{text-align:center;}
  #printInvoice .tot{margin-top:14px;margin-left:auto;width:260px;}
  #printInvoice .tot div{display:flex;justify-content:space-between;padding:6px 8px;}
  #printInvoice .tot .g{border-top:2px solid #1f2a44;font-size:15px;font-weight:700;background:#f1f3f8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #printInvoice .words{margin-top:10px;font-style:italic;color:#444;}
  #printInvoice .foot{margin-top:50px;display:flex;justify-content:space-between;align-items:flex-end;}
  #printInvoice .sig{border-top:1px solid #111;width:200px;text-align:center;padding-top:4px;font-size:11px;}
  #printInvoice .thanks{text-align:center;margin-top:30px;color:#667085;font-size:11px;}
}
</style>
<div id="printInvoice"></div>
<h1 class="page-title">Create Invoice</h1>

<div class="card" id="invCard" style="max-width:860px;margin:0 auto;overflow:visible;">
  <!-- Customer Info -->
  <div class="grid-2" style="margin-bottom:1rem;">
    <div>
      <label>DS Code</label>
      <div style="display:flex;gap:.5rem;align-items:center;">
        <input id="dsCode" type="text" placeholder="e.g. 123456" autocomplete="off"
          style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
        <button class="btn btn-ghost" type="button" onclick="lookupDS()" style="white-space:nowrap;padding:.6rem 1rem;">
          Look up
        </button>
      </div>
      <div id="dsStatus" style="font-size:.78rem;margin-top:.35rem;color:var(--muted);min-height:1.1em;"></div>
    </div>
    <div>
      <label>Customer Name *</label>
      <input id="custName" type="text" placeholder="Enter full name" autocomplete="off">
    </div>
  </div>
  <div class="grid-2" style="margin-bottom:1.5rem;">
    <div>
      <label>Phone Number</label>
      <input id="custPhone" type="tel" placeholder="e.g. 9876543210" autocomplete="off">
    </div>
    <div></div>
  </div>

  <div style="margin-bottom:1.5rem;">
    <label>Notes / Address</label>
    <textarea id="custNotes" rows="2" placeholder="Delivery address or remarks…"></textarea>
  </div>

  <!-- Items Section -->
  <div style="border-top:1px solid var(--border);padding-top:1.5rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="margin:0;font-size:1rem;font-weight:600;">Items</h3>
      <button class="btn btn-ghost" id="addRowBtn" style="font-size:.82rem;" onclick="addRow()">+ Add Item</button>
    </div>

    <!-- Desktop table -->
    <div class="table-wrap inv-table-wrap" style="overflow:visible;">
      <table>
        <thead><tr>
          <th style="width:42%;">Product</th>
          <th style="width:14%;">Qty</th>
          <th style="width:18%;">Price (₹)</th>
          <th style="width:18%;">Total</th>
          <th style="width:8%;"></th>
        </tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>
    <!-- Mobile cards -->
    <div id="mobileItems" class="inv-mobile-items"></div>

    <div style="margin-top:1.5rem;text-align:right;">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">GRAND TOTAL</div>
      <div id="grandTotal" style="font-size:2rem;font-weight:700;color:var(--primary);">₹0.00</div>
    </div>
  </div>

  <!-- Actions -->
  <div style="border-top:1px solid var(--border);padding-top:1.5rem;display:flex;gap:1rem;justify-content:flex-end;flex-wrap:wrap;" class="no-print invoice-actions">
    <button class="btn btn-ghost" onclick="printInvoice()">🖨 Print / PDF</button>
    <button class="btn btn-ghost" onclick="saveInvoice(true)">💾🖨 Save &amp; Print</button>
    <button class="btn btn-primary" id="saveBtn" onclick="saveInvoice()">💾 Save Invoice</button>
  </div>

  <!-- Success Toast -->
  <div id="toast" style="display:none;margin-top:1rem;padding:1rem 1.5rem;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:12px;color:var(--green);font-weight:600;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let products = [];
let rowCount = 0;

// Load products from live inventory
async function loadProducts() {
  try {
    const r = await fetch('/api/stock_check');
    const d = await r.json();
    products = d.products || [];
  } catch(e) {
    products = [];
  }
}

function isMobileView() { return window.innerWidth <= 768; }

function addRow(name='', qty=1, price=0) {
  rowCount++;
  const id = rowCount;

  if (isMobileView()) {
    // Card-style row for mobile
    const container = document.getElementById('mobileItems');
    const card = document.createElement('div');
    card.id = `row-${id}`;
    card.className = 'inv-card';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;">
        <span style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);">Item ${id}</span>
        <button class="btn btn-danger" style="padding:.3rem .6rem;font-size:.75rem;" onclick="removeRow(${id})">✕ Remove</button>
      </div>
      <div class="ac-wrapper" style="margin-bottom:.6rem;">
        <input type="text" id="prod-${id}" placeholder="Search product…" autocomplete="off"
          oninput="onProdInput(${id})" onfocus="onProdInput(${id})">
        <div class="ac-list" id="ac-${id}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;align-items:end;">
        <div>
          <label style="margin-bottom:.25rem;">Qty</label>
          <input type="number" id="qty-${id}" value="${qty}" min="0.01" step="any" oninput="recalcRow(${id})">
        </div>
        <div>
          <label style="margin-bottom:.25rem;">Price (₹)</label>
          <input type="number" id="price-${id}" value="${price}" min="0" step="any" oninput="recalcRow(${id})">
        </div>
      </div>
      <div style="text-align:right;margin-top:.5rem;font-weight:700;color:var(--primary);" id="tot-${id}">₹0.00</div>
    `;
    container.appendChild(card);
  } else {
    // Desktop table row
    const tbody = document.getElementById('itemsBody');
    const tr = document.createElement('tr');
    tr.id = `row-${id}`;
    tr.innerHTML = `
      <td>
        <div class="ac-wrapper">
          <input type="text" id="prod-${id}" placeholder="Search product…" autocomplete="off"
            oninput="onProdInput(${id})" onfocus="onProdInput(${id})">
          <div class="ac-list" id="ac-${id}"></div>
        </div>
      </td>
      <td><input type="number" id="qty-${id}" value="${qty}" min="0.01" step="any" oninput="recalcRow(${id})"></td>
      <td><input type="number" id="price-${id}" value="${price}" min="0" step="any" oninput="recalcRow(${id})"></td>
      <td style="font-weight:600;color:var(--primary);" id="tot-${id}">₹0.00</td>
      <td><button class="btn btn-danger" style="padding:.4rem .7rem;font-size:.8rem;" onclick="removeRow(${id})">✕</button></td>
    `;
    tbody.appendChild(tr);
  }

  recalcRow(id);
  document.getElementById(`prod-${id}`).focus();
}

function removeRow(id) {
  document.getElementById(`row-${id}`)?.remove();
  recalcGrand();
}

function recalcRow(id) {
  const qty = parseFloat(document.getElementById(`qty-${id}`)?.value || 0);
  const price = parseFloat(document.getElementById(`price-${id}`)?.value || 0);
  const tot = qty * price;
  const el = document.getElementById(`tot-${id}`);
  if (el) el.textContent = '₹' + tot.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
  recalcGrand();
}

function recalcGrand() {
  let grand = 0;
  document.querySelectorAll('[id^="row-"]').forEach(el => {
    const id = el.id.replace('row-', '');
    const qty = parseFloat(document.getElementById(`qty-${id}`)?.value || 0);
    const price = parseFloat(document.getElementById(`price-${id}`)?.value || 0);
    grand += qty * price;
  });
  document.getElementById('grandTotal').textContent = '₹' + grand.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function onProdInput(id) {
  const inp = document.getElementById(`prod-${id}`);
  const val = (inp?.value || '').toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(val)).slice(0, 25);
  hideAllAC();
  if (!filtered.length) return;

  const rect = inp.getBoundingClientRect();
  const list = document.getElementById(`ac-${id}`);
  const isMobile = window.innerWidth <= 768;
  const vv = window.visualViewport;
  const viewBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
  const viewTop = vv ? vv.offsetTop : 0;
  const maxH = isMobile ? Math.round((viewBottom - viewTop) * 0.42) : 230;
  const spaceBelow = viewBottom - rect.bottom - 8;
  const spaceAbove = rect.top - viewTop - 8;
  const openAbove = spaceBelow < 180 && spaceAbove > spaceBelow;

  list.style.position = 'fixed';
  list.style.zIndex = '9999';
  list.style.maxHeight = maxH + 'px';
  list.style.bottom = '';
  list.style.top = '';

  if (isMobile) {
    list.style.left = '8px';
    list.style.right = '8px';
    list.style.width = 'calc(100vw - 16px)';
  } else {
    list.style.left = rect.left + 'px';
    list.style.right = '';
    list.style.width = Math.max(rect.width, 300) + 'px';
  }

  if (openAbove) {
    list.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    list.style.maxHeight = Math.min(maxH, Math.max(120, spaceAbove)) + 'px';
    list.style.top = '';
  } else {
    list.style.top = (rect.bottom + 4) + 'px';
    list.style.bottom = '';
    list.style.maxHeight = Math.min(maxH, Math.max(120, spaceBelow)) + 'px';
  }

  list.innerHTML = filtered.map(p => {
    const rem = p.remaining;
    const badge = rem <= 0
      ? `<span class="ac-oos">OOS</span>`
      : rem <= 5
      ? `<span class="ac-low">Low:${rem}</span>`
      : `<span class="ac-ok">✓${rem}</span>`;
    return `<div class="ac-item" onmousedown="selectProd(${id}, '${p.name.replace(/'/g,"\\'")}', ${p.price})">
      <span class="ac-name">${p.name}</span>${badge}
    </div>`;
  }).join('');
  list.style.display = 'block';
}

function hideAllAC() {
  document.querySelectorAll('.ac-list').forEach(l => l.style.display = 'none');
}

function selectProd(id, name, price) {
  document.getElementById(`prod-${id}`).value = name;
  document.getElementById(`price-${id}`).value = price;
  document.getElementById(`ac-${id}`).style.display = 'none';
  recalcRow(id);
}

['click','touchstart'].forEach(ev => document.addEventListener(ev, e => {
  if (!e.target.closest('.ac-wrapper')) hideAllAC();
}, {passive: true}));

let acRaf = 0;
function repositionAC() {
  if (acRaf) return;
  acRaf = requestAnimationFrame(() => {
    acRaf = 0;
    const open = [...document.querySelectorAll('.ac-list')].find(l => l.style.display === 'block');
    if (open) onProdInput(open.id.replace('ac-', ''));
  });
}
window.addEventListener('scroll', e => {
  if (e.target && e.target.classList && e.target.classList.contains('ac-list')) return;
  repositionAC();
}, true);
window.addEventListener('resize', repositionAC);
if (window.visualViewport) window.visualViewport.addEventListener('resize', repositionAC);

function getItems() {
  const rows = document.querySelectorAll('[id^="row-"]');
  const items = [];
  rows.forEach(el => {
    const id = el.id.replace('row-', '');
    const name = (document.getElementById(`prod-${id}`)?.value || '').trim();
    const qty = parseFloat(document.getElementById(`qty-${id}`)?.value || 0);
    const price = parseFloat(document.getElementById(`price-${id}`)?.value || 0);
    if (name && qty > 0) items.push({name, qty, price});
  });
  return items;
}

const SELLER_NAME = 'Customer Ledger';   // shown at top of printed bill – change to business name
const SELLER_SUB = '';                   // optional address / phone line

function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function inr(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function numWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  n=Math.round(n); if(!n) return 'Zero';
  let out=[];const cr=Math.floor(n/1e7),lk=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,rest=n%1000;
  if(cr)out.push(three(cr)+' Crore');if(lk)out.push(two(lk)+' Lakh');if(th)out.push(two(th)+' Thousand');if(rest)out.push(three(rest));
  return out.join(' ');
}
function buildPrint(invNo){
  const items=getItems();
  const name=document.getElementById('custName').value.trim();
  const phone=document.getElementById('custPhone').value.trim();
  const ds=document.getElementById('dsCode').value.trim().toUpperCase();
  const notes=document.getElementById('custNotes').value.trim();
  const date=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  let total=0;
  const rows=items.map((i,k)=>{const t=i.qty*i.price;total+=t;
    return `<tr><td class="c">${k+1}</td><td>${esc(i.name)}</td><td class="c">${i.qty}</td><td class="r">${inr(i.price)}</td><td class="r">${inr(t)}</td></tr>`;}).join('');
  document.getElementById('printInvoice').innerHTML=`
    <div class="ph"><div><div class="biz">${esc(SELLER_NAME)}</div><div>${esc(SELLER_SUB)}</div></div>
      <div class="ttl">INVOICE</div></div>
    <div class="meta">
      <div class="box"><div class="lbl">Billed To</div><b>${esc(name)||'—'}</b>
        ${ds?`<div>DS Code: ${esc(ds)}</div>`:''}${phone?`<div>Phone: ${esc(phone)}</div>`:''}
        ${notes?`<div style="white-space:pre-line;">${esc(notes)}</div>`:''}</div>
      <div class="box" style="max-width:220px;"><div class="lbl">Invoice Details</div>
        <div>Invoice No: <b>${esc(invNo||'DRAFT')}</b></div><div>Date: ${date}</div></div>
    </div>
    <table><thead><tr><th class="c" style="width:6%;">#</th><th>Description</th><th class="c" style="width:10%;">Qty</th><th class="r" style="width:16%;">Rate</th><th class="r" style="width:18%;">Amount</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="tot"><div class="g"><span>Grand Total</span><span>${inr(total)}</span></div></div>
    <div class="words">Amount in words: Rupees ${numWords(total)} Only</div>
    <div class="foot"><div></div><div class="sig">Authorised Signature</div></div>
    <div class="thanks">Thank you for your business!</div>`;
}
function printInvoice(invNo){
  if(!getItems().length){alert('Add at least one item');return;}
  buildPrint(typeof invNo==='string'?invNo:'');
  setTimeout(()=>window.print(),50);
}

async function saveInvoice(printAfter) {
  const name = document.getElementById('custName').value.trim();
  if (!name) { alert('Customer name is required'); return; }
  const items = getItems();
  if (!items.length) { alert('Add at least one item'); return; }

  document.getElementById('saveBtn').disabled = true;
  document.getElementById('saveBtn').textContent = 'Saving…';

  try {
    const r = await fetch('/api/customer_invoice', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        ds_code: document.getElementById('dsCode').value.trim().toUpperCase(),
        customer_name: name,
        customer_phone: document.getElementById('custPhone').value.trim(),
        notes: document.getElementById('custNotes').value.trim(),
        items: items.map(i => ({description: i.name, qty: i.qty, price: i.price}))
      })
    });
    const d = await r.json();
    if (d.success) {
      const toast = document.getElementById('toast');
      toast.textContent = `✓ Invoice ${d.invoice_no} saved — ₹${d.amount.toLocaleString('en-IN',{maximumFractionDigits:0})}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 5000);
      if (printAfter === true) { buildPrint(d.invoice_no); }
      // Reset form
      document.getElementById('dsCode').value = '';
      document.getElementById('dsStatus').textContent = '';
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custNotes').value = '';
      document.getElementById('itemsBody').innerHTML = '';
      document.getElementById('mobileItems').innerHTML = '';
      recalcGrand();
      if (printAfter === true) setTimeout(()=>window.print(), 50);
    } else {
      alert('Error: ' + (d.error || 'Unknown error'));
    }
  } catch(e) {
    alert('Network error: ' + e.message);
  } finally {
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').textContent = '💾 Save Invoice';
  }
}

async function lookupDS() {
  const code = document.getElementById('dsCode').value.trim().toUpperCase();
  if (!code) { alert('Enter a DS code first'); return; }
  const status = document.getElementById('dsStatus');
  status.textContent = 'Looking up…';
  status.style.color = 'var(--muted)';
  try {
    const r = await fetch(`/api/ds_lookup?ds_code=${encodeURIComponent(code)}`);
    const d = await r.json();
    if (d.error) {
      status.textContent = '✗ Not found';
      status.style.color = 'var(--red)';
    } else {
      document.getElementById('custName').value = d.ds_name || '';
      document.getElementById('custPhone').value = d.mobile || '';
      status.textContent = `✓ ${d.ds_name}`;
      status.style.color = 'var(--green)';
    }
  } catch(e) {
    status.textContent = '✗ Lookup failed';
    status.style.color = 'var(--red)';
  }
}

// Allow Enter key on DS code field to trigger lookup
document.getElementById('dsCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); lookupDS(); }
});

fetch('/api/warm').catch(()=>{});  // wake ledger + preload DS lists
loadProducts().then(() => addRow());
</script>
{% endblock %}
