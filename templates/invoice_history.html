{% extends "base.html" %}
{% block title %}Invoice History{% endblock %}

{% block content %}
<h1 class="page-title">Invoice History</h1>

<div class="search-bar no-print">
  <span style="color:var(--muted);">🔍</span>
  <input id="searchInput" placeholder="Search by name, invoice no…" oninput="filter()">
  <select id="statusFilter" onchange="filter()" style="width:auto;padding:.4rem .8rem;font-size:.85rem;">
    <option value="">All Status</option>
    <option value="pending">Pending</option>
    <option value="completed">Completed</option>
    <option value="cancelled">Cancelled</option>
  </select>
</div>

<div class="card">
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Invoice No</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Items</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Date</th>
        <th class="no-print">Actions</th>
      </tr></thead>
      <tbody id="tableBody">
        <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem;">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Invoice Detail Modal -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;">
  <div class="card" style="max-width:600px;width:90%;max-height:85vh;overflow-y:auto;position:relative;">
    <button onclick="closeModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;">✕</button>
    <div id="modalContent"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allRows = [];

async function load() {
  const r = await fetch('/api/customer_invoice');
  allRows = await r.json();
  render(allRows);
}

function statusBadge(s) {
  if (s === 'pending') return '<span class="badge badge-yellow">Pending</span>';
  if (s === 'completed') return '<span class="badge badge-green">Completed</span>';
  if (s === 'cancelled') return '<span class="badge badge-red">Cancelled</span>';
  return `<span class="badge badge-blue">${s}</span>`;
}

function render(rows) {
  if (!rows.length) {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem;">No invoices found</td></tr>';
    return;
  }
  document.getElementById('tableBody').innerHTML = rows.map(r => {
    let items = [];
    try { items = JSON.parse(r.items || '[]'); } catch(e) {}
    const d = r.date_created ? r.date_created.slice(0,10) : '—';
    return `<tr>
      <td style="font-weight:600;">${r.invoice_no}</td>
      <td>${r.customer_name}</td>
      <td style="color:var(--muted);">${r.customer_phone || '—'}</td>
      <td style="color:var(--muted);">${items.length} item${items.length !== 1 ? 's' : ''}</td>
      <td style="font-weight:600;">₹${(r.amount||0).toLocaleString('en-IN',{maximumFractionDigits:0})}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="color:var(--muted);">${d}</td>
      <td class="no-print">
        <button class="btn btn-ghost" style="font-size:.78rem;padding:.35rem .7rem;" onclick="viewInvoice(${r.id})">View</button>
        ${r.status === 'pending' ? `<button class="btn btn-danger" style="font-size:.78rem;padding:.35rem .7rem;margin-left:.4rem;" onclick="cancel(${r.id})">Cancel</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

function filter() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const filtered = allRows.filter(r => {
    const match = !q || r.invoice_no.toLowerCase().includes(q) || r.customer_name.toLowerCase().includes(q);
    const statusMatch = !st || r.status === st;
    return match && statusMatch;
  });
  render(filtered);
}

async function cancel(id) {
  if (!confirm('Cancel this invoice?')) return;
  await fetch(`/api/customer_invoice/${id}/cancel`, {method:'POST'});
  load();
}

async function viewInvoice(id) {
  const r = await fetch(`/api/customer_invoice/${id}`);
  const inv = await r.json();
  let items = [];
  try { items = JSON.parse(inv.items || '[]'); } catch(e) {}
  const rows = items.map(it => {
    const desc = it.description || it.name || '';
    const qty = it.qty || 0;
    const price = it.price || 0;
    return `<tr>
      <td>${desc}</td>
      <td style="text-align:center;">${qty}</td>
      <td style="text-align:right;">₹${price.toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
      <td style="text-align:right;font-weight:600;">₹${(qty*price).toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
    </tr>`;
  }).join('');

  document.getElementById('modalContent').innerHTML = `
    <h2 style="margin:0 0 .4rem;font-size:1.3rem;">${inv.invoice_no}</h2>
    <p style="color:var(--muted);margin:0 0 1.2rem;font-size:.85rem;">${inv.date_created?.slice(0,10) || ''}</p>
    <div class="grid-2" style="margin-bottom:1rem;font-size:.9rem;">
      <div><label>Customer</label>${inv.customer_name}</div>
      <div><label>Phone</label>${inv.customer_phone || '—'}</div>
    </div>
    ${inv.notes ? `<div style="margin-bottom:1rem;font-size:.9rem;"><label>Notes</label>${inv.notes}</div>` : ''}
    <table style="width:100%;font-size:.88rem;border-collapse:collapse;">
      <thead><tr style="border-bottom:1px solid var(--border);">
        <th style="padding:.6rem;text-align:left;color:var(--muted);">Product</th>
        <th style="padding:.6rem;text-align:center;color:var(--muted);">Qty</th>
        <th style="padding:.6rem;text-align:right;color:var(--muted);">Price</th>
        <th style="padding:.6rem;text-align:right;color:var(--muted);">Total</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:1rem;text-align:right;font-size:1.3rem;font-weight:700;color:var(--primary);">
      Grand Total: ₹${(inv.amount||0).toLocaleString('en-IN',{minimumFractionDigits:2})}
    </div>
  `;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

load();
</script>
{% endblock %}
